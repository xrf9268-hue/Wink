name: Scanner Noise

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  noisy:
    name: Text that only looks like a reference
    runs-on: ubuntu-latest
    steps:
      # uses: actions/checkout@v4
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Heredoc mentioning mutable references
        run: |
          cat <<'EOF'
          uses: actions/checkout@v4
          uses: some-org/some-action@main
          EOF
          echo "uses: actions/cache@v3"

      - name: Folded scalar mentioning a mutable reference
        run: >
          echo uses: example-org/example-action@main

      - name: Upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: noise
          path: |
            build/*.dmg
            uses: not-a-real/reference@v1
